name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build and test
    runs-on: ubuntu-latest
    env:
      # Throwaway password for the job's own SQL Server container. Not used anywhere else.
      MSSQL_SA_PASSWORD: Ci-Only-Passw0rd
      HELPDESK_TEST_CONNECTION: Server=localhost,1433;Database=Helpdesk_Test;User Id=sa;Password=Ci-Only-Passw0rd;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4

      # Knowledge base search needs SQL Server Full-Text Search, which the stock image lacks,
      # so the job builds its own image instead of using a service container.
      - name: Start SQL Server with Full-Text Search
        run: |
          docker build -t helpdesk-sqlserver-fts docker/sqlserver
          docker run -d --name sqlserver -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" helpdesk-sqlserver-fts
          for attempt in $(seq 1 40); do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            sleep 3
          done
          docker logs sqlserver
          exit 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Helpdesk.slnx
      - run: dotnet build Helpdesk.slnx --no-restore --configuration Release
      - run: dotnet test Helpdesk.slnx --no-build --configuration Release

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
